[project]
name = "leads"
version = "0.1.0"
description = "Vilnius businesses that look busy on Google Maps but declare little staff and tax."
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "duckdb>=1.5.6",
    "typer>=0.27.3",
]

[project.scripts]
leads = "leads.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D401", "PTH"]
